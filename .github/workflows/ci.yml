name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Node 24 / npm 11: lockfile was generated with npm 11; npm 10
          # (Node 20/22) fails `npm ci` on optional @cloudflare/workers-types peers.
          # Also matches wrangler/ai engines (>=22) and babel (^22.18 || >=24.11).
          node-version: '24'
          cache: npm
      - run: npm ci
      # Root-only: `npm run lint` also lints ui/ and needs ui/node_modules.
      # UI lint runs in the ui job below.
      - run: npx eslint . --max-warnings 0
      # Covers ui/ too — .prettierignore excludes ui/node_modules and ui/dist,
      # not ui/ source, and prettier is a root-only devDependency.
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage -- --run

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run build
        working-directory: ui
